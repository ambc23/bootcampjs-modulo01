<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevas Colecciones</title>

    <link rel="stylesheet" href="styles.css">   
</head>
<body>
    <header class="header">
        <button class="header__menu" type="button" aria-label="Abrir menú">
            <img src="assets/iconos/icon-menu-burguer.svg" alt="">
        </button>

        <nav class="nav" aria-label="Princpal">
            <ul class="nav__list">
                <li><a href="#">Moda mujer</a></li>
                <li><a href="#">Moda hombre</a></li>
                <li><a href="#">Nueva colección</a></li>
                <li><a href="#">Colecciones especiales</a></li>
            </ul>
        </nav>

        <div class="header__actions">
            <a href="#" aria-label="Mi cuenta"><img src="assets/iconos/icon-user.svg" alt=""></a>
            <a href="#" aria-label="Favoritos"><img src="assets/iconos/icon-heart.svg" alt=""></a>
            <a href="#" aria-label="Carrito"><img src="assets/iconos/icon-shopping-cart.svg" alt=""></a>
        </div>
    </header>

    <main class="main">
        <h1 class="title">Nuevas colecciones</h1>
        
        <section class="cards" aria-label="Productos">
            <article class="card">
                <img class="card__img" src="assets/img/image-3.jpg" alt="Vestido turquesa claro">
                <div class="card__info">
                    <h2 class="card__name">Vestido</h2>
                    <p class="card__price">34,99€</p>
                </div>
            </article>

            <article class="card">
                <img class="card__img" src="assets/img/image-6.jpg" alt="Camisa amarilla">
                <div class="card__info">
                    <h2 class="card__name">Camisa</h2>
                    <p class="card__price">44,99€</p>
                </div>
            </article>

            <article class="card">
                <img class="card__img" src="assets/img/image-4.jpg" alt="Vaqueros blancos">
                <div class="card__info">
                    <h2 class="card__name">Vaqueros</h2>
                    <p class="card__price">79,99€</p>
                </div>
            </article>

            <article class="card">
                <img class="card__img" src="assets/img/image-5.jpg" alt="Polo beige">
                <div class="card__info">
                    <h2 class="card__name">Polo</h2>
                    <p class="card__price">44,99€</p>
                </div>
            </article>

            <article class="card">
                <img class="card__img" src="assets/img/image-1.jpg" alt="Camisa gris">
                <div class="card__info">
                    <h2 class="card__name">Camisa</h2>
                    <p class="card__price">25,99€</p>
                </div>
            </article>

            <article class="card">
                <img class="card__img" src="assets/img/image-2.jpg" alt="Camiseta blanca">
                <div class="card__info">
                    <h2 class="card__name">Camiseta</h2>
                    <p class="card__price">22,99€</p>
                </div>
            </article>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__item">
            <span class="footer__icon"><img src="assets/iconos/icon-truck.svg" alt=""></span>
            <a href="#">Entrega</a>
        </div>
        <div class="footer__item">
            <a href="#">Devoluciones y cambios</a>
        </div>
        <div class="footer__item">
            <span class="footer__icon"><img src="assets/iconos/icon-phone.svg" alt=""></span>
            <a href="#">+375 (29) 749-18-23</a>
        </div>
        <div class="footer__item">
            <span class="footer__icon"><img src="assets/iconos/icon-mail.svg" alt=""></span>
            <a href="mailto:shop@mix.com">shop@mix.com</a>
        </div>
    </footer>
</body>
</html>
